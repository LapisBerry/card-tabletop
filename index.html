<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Card Tabletop</title>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <canvas id="table" aria-label="3D card table"></canvas>

    <header class="badge">
      <h1>Card Tabletop</h1>
      <p>Prototype · table and cards</p>
    </header>

    <aside class="help" id="help" aria-label="Controls">
      <h2>Controls</h2>
      <dl>
        <dt>Right-drag</dt><dd>Move the view</dd>
        <dt>Middle-drag or Shift + right-drag</dt><dd>Tilt and turn</dd>
        <dt>Wheel</dt><dd>Zoom</dd>
        <dt>Arrow keys</dt><dd>Move the view</dd>
        <dt>One finger</dt><dd>Move the view (touch)</dd>
        <dt>Two fingers</dt><dd>Zoom and turn (touch)</dd>
        <dt>H</dt><dd>Reset the view</dd>
        <dt>?</dt><dd>Show or hide this panel</dd>
      </dl>
    </aside>

    <div class="toolbar">
      <button type="button" id="reset-view">Reset view</button>
      <button type="button" id="toggle-help" aria-controls="help" aria-expanded="true">Controls</button>
    </div>

    <p class="error" id="error" hidden></p>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
